<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Create One Yourself</title>
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='13' font-size='13'>%F0%9F%95%B7</text></svg>"
    />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
      canvas { display: block; }

      #ui {
        position: fixed;
        inset: 0;
        pointer-events: none;
        font-family: "Courier New", Courier, monospace;
        color: #cfd6d0;
      }

      #crosshair {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 5px;
        height: 5px;
        margin: -2.5px 0 0 -2.5px;
        border-radius: 50%;
        background: rgba(220, 235, 220, 0.45);
        opacity: 0;
        transition: opacity 0.4s;
      }
      body.playing #crosshair { opacity: 1; }

      #overlay {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1.5rem;
        background: radial-gradient(ellipse at center, #0a0d0a 0%, #000 70%);
        font-family: "Courier New", Courier, monospace;
        color: #9aa79c;
        cursor: pointer;
        z-index: 10;
        transition: opacity 0.6s;
      }
      body.playing #overlay { opacity: 0; pointer-events: none; }
      /* The debug menu has to release pointer lock to give you the cursor, and
         the start screen is keyed off that lock — so without this it sits
         behind the editor the whole time you are in there, and is the first
         thing you see again the moment you close it. */
      body.debugging #overlay { opacity: 0; pointer-events: none; }

      #overlay h1 {
        font-size: clamp(1.4rem, 4vw, 2.6rem);
        letter-spacing: 0.18em;
        font-weight: normal;
        text-transform: uppercase;
      }
      #overlay h1 .g { color: #46e07a; }
      #overlay h1 .b { color: #4aa8ff; }
      #overlay h1 .p { color: #b96cff; }

      #overlay p { font-size: 0.85rem; letter-spacing: 0.12em; line-height: 2; text-align: center; }
      #overlay .prompt { color: #e6efe8; animation: pulse 2.4s ease-in-out infinite; }
      @keyframes pulse { 0%, 100% { opacity: 0.35; } 50% { opacity: 1; } }

      /* Objective banner, top centre. */
      #objective {
        position: absolute;
        top: 2.2rem;
        left: 50%;
        transform: translateX(-50%);
        text-align: center;
        opacity: 0;
        transition: opacity 0.5s;
      }
      body.playing #objective { opacity: 1; }

      #objective .label {
        font-size: 0.62rem;
        letter-spacing: 0.42em;
        color: #6f7d72;
        text-transform: uppercase;
        margin-bottom: 0.45rem;
      }

      #objective-text {
        font-size: 1rem;
        letter-spacing: 0.1em;
        color: #dfe9e0;
        text-shadow: 0 0 12px rgba(0, 0, 0, 0.9);
      }

      /* Replay this whenever the objective changes so it catches the eye. */
      #objective.updated #objective-text {
        animation: objective-in 0.7s ease-out;
      }
      @keyframes objective-in {
        0% { opacity: 0; transform: translateY(-8px); color: #46e07a; }
        60% { opacity: 1; color: #46e07a; }
        100% { opacity: 1; transform: none; color: #dfe9e0; }
      }

      /* Interact prompt, just under the crosshair. */
      #prompt {
        position: absolute;
        top: 56%;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        align-items: center;
        gap: 0.6rem;
        opacity: 0;
        transition: opacity 0.18s;
      }
      #prompt.visible { opacity: 1; }

      #prompt .key {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-width: 1.7rem;
        height: 1.7rem;
        padding: 0 0.4rem;
        border: 1px solid #9aa79c;
        border-radius: 4px;
        font-size: 0.8rem;
        color: #e6efe8;
        background: rgba(10, 14, 11, 0.65);
      }

      #prompt-label {
        font-size: 0.82rem;
        letter-spacing: 0.12em;
        color: #e6efe8;
        text-shadow: 0 0 10px rgba(0, 0, 0, 0.9);
      }

      #vignette {
        position: fixed;
        inset: 0;
        pointer-events: none;
        box-shadow: inset 0 0 22vw 9vw rgba(0, 0, 0, 0.92);
        z-index: 5;
      }
    </style>
  </head>
  <body>
    <div id="ui">
      <div id="crosshair"></div>
      <div id="objective">
        <div class="label">Objective</div>
        <div id="objective-text"></div>
      </div>
      <div id="prompt">
        <span class="key" id="prompt-key">E</span><span id="prompt-label"></span>
      </div>
    </div>
    <div id="vignette"></div>

    <div id="overlay">
      <h1><span class="g">Create</span> <span class="b">One</span> <span class="p">Yourself</span></h1>
      <p>
        WASD / arrows &nbsp;—&nbsp; move<br />
        mouse &nbsp;—&nbsp; look &nbsp;&nbsp;·&nbsp;&nbsp; shift &nbsp;—&nbsp; run<br />
        space &nbsp;—&nbsp; jump &nbsp;&nbsp;·&nbsp;&nbsp; E &nbsp;—&nbsp; interact<br />
        F &nbsp;—&nbsp; possess &nbsp;&nbsp;·&nbsp;&nbsp; esc &nbsp;—&nbsp; release cursor
      </p>
      <p class="prompt">click to enter the room</p>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
